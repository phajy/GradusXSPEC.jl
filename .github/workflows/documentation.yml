name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Permissions needed to:
    # - Deploy docs with GITHUB_TOKEN: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          # Fresh runners (and branch-scoped caches) may not have General yet.
          # Adding only AstroRegistry first can leave General missing, so deps
          # like MutableArithmetics fail with "expected package to be registered".
          Pkg.Registry.add("General")
          # Gradus is published via AstroRegistry, not General
          Pkg.Registry.add(url = "https://github.com/astro-group-bristol/AstroRegistry")
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
